services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: halcyon-expert-gateway
    environment:
      - CTF_SECRET=${CTF_SECRET}
    ports:
      - "8005:5000"
    networks:
      - public-net
      - internal-net

  directory:
    build:
      context: .
      dockerfile: docker/directory/Dockerfile
    container_name: halcyon-expert-directory
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # No published ports -- internal-only, reachable only via the gateway.
    networks:
      - internal-net

  fileserver:
    build:
      context: .
      dockerfile: docker/fileserver/Dockerfile
    container_name: halcyon-expert-fileserver
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # No published ports -- internal-only, reachable only via the gateway.
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
